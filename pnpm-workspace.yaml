packages:
  - apps/*
  - packages/*

# Prisma needs its postinstall (engine download + client generate).
# `allowBuilds` is used by the local toolchain; `onlyBuiltDependencies` is the
# standard pnpm key honored in CI. Keep both in sync.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
